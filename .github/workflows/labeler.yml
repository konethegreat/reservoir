name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs with write permissions: this job only reads the
      # labeler config from the base branch and never checks out PR code.
      - uses: actions/labeler@v7
        with:
          sync-labels: true
