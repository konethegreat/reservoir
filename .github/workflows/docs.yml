name: Docs

on:
  push:
    branches: [main]
    paths: ['**.md', 'docs/**', 'mkdocs.yml', '.github/workflows/docs.yml', '.markdownlint-cli2.yaml', '.lychee.toml']
  pull_request:
    paths: ['**.md', 'docs/**', 'mkdocs.yml', '.github/workflows/docs.yml', '.markdownlint-cli2.yaml', '.lychee.toml']

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !node_modules

  links:
    name: Link check (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install mkdocs-material
      - run: mkdocs build
