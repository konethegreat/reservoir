name: Stale

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 90
          days-before-close: 30
          stale-issue-message: >
            This has been quiet for 90 days. If it is still relevant, please comment and it will stay open.
            Otherwise it will be closed in 30 days. Thank you for your contribution.
          stale-pr-message: >
            This pull request has been quiet for 90 days. Please comment if you are still working on it.
          exempt-issue-labels: 'pinned,security,cultural-sensitivity,roadmap,help wanted,good first issue'
          exempt-pr-labels: 'pinned,security'
