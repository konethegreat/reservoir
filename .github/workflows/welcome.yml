name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    if: github.actor != github.repository_owner && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Welcome to Reservoir, and thank you for your first issue! 🌿
            A maintainer will respond soon. Please remember: never paste sacred, restricted or community-held knowledge here without that community's consent (see CONTRIBUTING.md).
          pr_message: |
            Thank you for your first pull request to Reservoir! 🌿
            CI will run shortly. A maintainer will review it soon. Please check CONTRIBUTING.md for the project's ground rules on sources, consent and licences.
